[package]
name = "blip-app"
version = "0.1.0"
description = "Blip for Windows: iMessage through your Mac"
edition.workspace = true
license.workspace = true

[lib]
name = "blip_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blip-wire = { version = "0.1.0", path = "../../crates/blip-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync"] }
